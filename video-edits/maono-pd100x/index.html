    <script>
      const tl = gsap.timeline({ paused: true });
      const FACE = "50% 38%";
      const MIC_HEAD = "62% 96%";
      const MIC_BODY = "64% 90%";

      // ---- camera: punch-ins on emphasis, smooth zooms on product functions ----
      tl.set("#cam", { scale: 1, transformOrigin: FACE }, 0);
      // hook
      tl.set("#cam", { scale: 1.12 }, 0.73); // "berbaloi"
      tl.set("#cam", { scale: 1 }, 6);
      // same punch in its original place
      tl.set("#cam", { scale: 1.12 }, 14.18);
      tl.set("#cam", { scale: 1 }, 16.1);
      tl.set("#cam", { scale: 1.1 }, 24.1); // "Apatah lagi"
      tl.set("#cam", { scale: 1 }, 28.5);
      tl.set("#cam", { scale: 1.16 }, 30.08); // "Macam, huh"
      tl.set("#cam", { scale: 1 }, 31.95);
      // Dynamic capsule: zoom to the mic head
      tl.set("#cam", { transformOrigin: MIC_HEAD }, 35.0);
      tl.to("#cam", { scale: 1.45, duration: 0.8, ease: "power2.inOut" }, 35.35);
      tl.to("#cam", { scale: 1, duration: 0.6, ease: "power2.inOut" }, 41.2);
      // Touch-to-mute: zoom to the mic body
      tl.set("#cam", { transformOrigin: MIC_BODY }, 53.5);
      tl.to("#cam", { scale: 1.5, duration: 0.7, ease: "power2.inOut" }, 53.9);
      // jump cut over the muted pause, re-framed
      tl.set("#cam", { scale: 1.12 }, 58.3);
      // unmute + volume knob
      tl.to("#cam", { scale: 1.5, duration: 0.7, ease: "power2.inOut" }, 61.2);
      tl.to("#cam", { scale: 1, duration: 0.6, ease: "power2.inOut" }, 68.7);
      tl.set("#cam", { transformOrigin: FACE }, 69.4);
      tl.set("#cam", { scale: 1.1 }, 76.48); // "So dia punya connector"
      tl.set("#cam", { scale: 1 }, 79.7);
      tl.set("#cam", { scale: 1.1 }, 94.78); // "So kalau hampa berminat"
      tl.set("#cam", { scale: 1 }, 98.2);
      tl.set("#cam", { scale: 1.16 }, 101.62); // "Simple, but solid"

      // ---- B-roll: settle in, ease out ----
      const broll = [
        ["#bw-hook", 2.5, 3.5, false],
        ["#bw-mic1", 15.95, 3.5, true],
        ["#bw-mic2", 31.55, 3.4, true],
        ["#bw-ports", 79.3, 4.8, true],
        ["#bw-cable", 88.25, 4.15, true],
      ];
      broll.forEach(([sel, s, d, out]) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.07 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, s);
        if (out) tl.to(sel, { opacity: 0, duration: 0.28, ease: "power2.in" }, s + d - 0.28);
        else tl.set(sel, { opacity: 0 }, s + d);
      });

      // ---- end ----
      tl.to("#fade", { opacity: 1, duration: 0.5, ease: "power2.in" }, 103.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
