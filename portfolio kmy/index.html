<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AM Agency | Social Media Manager & Content</title>
    <meta name="description" content="Servis Social Media Manager dan Talent untuk brand yang nak nampak aktif & dipercayai.">
    <meta name="theme-color" content="#6366f1">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- 1. CONFIGURATION & VARIABLES --- */
        :root {
            --primary: #6366f1;       /* Indigo */
            --primary-dark: #4f46e5;
            --accent: #06b6d4;        /* Cyan/Teal */
            --bg-body: #f8fafc;       /* Off-white */
            --bg-card: #ffffff;
            --text-main: #1e293b;     /* Charcoal */
            --text-muted: #64748b;    /* Slate */
            --gradient-main: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(99, 102, 241, 0.1);
            --radius-md: 12px;
            --radius-lg: 20px;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --price-strikethrough: #94a3b8;
            --price-promo: #ef4444;
        }

        /* --- 2. RESET & GLOBAL STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: var(--font-main);
            background: linear-gradient(-45deg, #f8fafc, #f3e8ff, #e0e7ff, #f0f9ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }
        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; }
        
        /* Container: Lebar untuk desktop, padding tepi untuk mobile */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* --- 3. UTILITY CLASSES --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 32px; /* Lebih lebar di desktop */
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
        }
        .btn-primary { background: var(--gradient-main); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5); }
        .btn-secondary { background: rgba(255,255,255,0.8); color: var(--primary); border: 2px solid rgba(99,102,241,0.1); }
        .btn-secondary:hover { border-color: var(--primary); background: white; }
        .btn-accent { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); color: white; }

        .badge {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-popular { background: #fff1f2; color: #e11d48; }
        .badge-service { background: #eff6ff; color: #2563eb; }

        .section-title { text-align: center; margin-bottom: 4rem; }
        .section-title h2 {
            font-size: 2.8rem; font-weight: 800;
            background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem; letter-spacing: -1px;
        }

        /* --- 4. NAVIGATION --- */
        .navbar {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.3); padding: 1.2rem 0;
        }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .nav-links { display: flex; gap: 2.5rem; align-items: center; }
        .nav-item { font-weight: 500; cursor: pointer; position: relative; font-size: 1.05rem; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active::after { content: ''; position: absolute; width: 100%; height: 2px; bottom: -4px; left: 0; background: var(--accent); }
        .mobile-menu-btn { display: none; font-size: 1.8rem; cursor: pointer; }

        /* Mobile Menu Overlay */
        .mobile-nav-overlay {
            position: fixed; top: 78px; left: 0; width: 100%; background: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); padding: 1.5rem;
            display: none; flex-direction: column; gap: 1.5rem; z-index: 999;
            text-align: center; font-weight: 600; font-size: 1.1rem; border-bottom: 1px solid #f1f5f9;
        }
        .mobile-nav-overlay.open { display: flex; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- 5. HERO SECTION --- */
        /* Desktop Default: 2 Columns */
        .hero { padding: 6rem 0; display: grid; grid-template-columns: 1.2fr 1fr; gap: 5rem; align-items: center; min-height: 85vh; }
        .hero-text h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 1.5rem; font-weight: 800; letter-spacing: -1.5px; }
        .hero-text p { font-size: 1.2rem; margin-bottom: 2rem; color: var(--text-muted); line-height: 1.7; }
        
        .honest-note {
            background: linear-gradient(90deg, #4f46e5, #8b5cf6); color: white;
            padding: 8px 24px; border-radius: 50px; font-weight: 700; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 1.5rem; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }
        .honest-note:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6); }

        .key-message-box {
            background: var(--gradient-main); color: white; font-weight: 700; margin-bottom: 2.5rem;
            display: inline-flex; align-items: center; gap: 15px; padding: 18px 35px;
            border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5); font-size: 1.1rem;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .key-message-icon {
            background: white; color: var(--primary); width: 32px; height: 32px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }

        .hero-visual { position: relative; perspective: 1000px; }
        .visual-card {
            background: white; padding: 12px; border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); position: relative; z-index: 2;
            transform: rotateY(-5deg) rotateX(2deg); transition: 0.5s ease-out; overflow: hidden;
        }
        .visual-card:hover { transform: rotateY(0) rotateX(0) scale(1.02); box-shadow: 0 25px 50px rgba(0,0,0,0.15); }
        .visual-card img { width: 100%; height: 400px; object-fit: cover; border-radius: 12px; }

        .floating-stat {
            position: absolute; background: white; padding: 1.2rem 1.5rem; border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px; z-index: 3;
            animation: floatY 4s infinite ease-in-out; white-space: nowrap;
        }
        .stat-1 { top: 40px; right: -40px; animation-delay: 1s; }
        .stat-2 { bottom: 50px; left: -40px; }
        @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* --- 6. CARDS & GRID --- */
        /* Desktop: 3 Columns */
        .benefits-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5rem; }
        .benefit-card {
            background: rgba(255,255,255,0.7); padding: 2.5rem; border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.5); transition: 0.3s;
        }
        .benefit-card:hover { background: white; transform: translateY(-8px); box-shadow: var(--shadow-md); }
        .icon-box {
            width: 60px; height: 60px; background: var(--gradient-main); border-radius: 16px;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 1.8rem; margin-bottom: 1.5rem;
        }

        .feat-pill {
            display: flex; align-items: center; gap: 8px; background: white; padding: 12px 24px;
            border-radius: 50px; font-size: 1rem; font-weight: 600; box-shadow: var(--shadow-sm); transition: 0.3s;
        }
        .feat-pill:hover { transform: translateY(-3px); }

        /* --- 7. PRODUCTS TABS & CARDS --- */
        .category-tabs { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 3rem; flex-wrap: wrap; }
        .tab-btn {
            background: white; border: 2px solid #e2e8f0; padding: 12px 30px; border-radius: 50px;
            font-size: 1.1rem; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active, .tab-btn:hover { background: var(--gradient-main); border-color: transparent; color: white; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3); transform: translateY(-2px); }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); justify-content: center; gap: 3rem; padding-bottom: 5rem; }
        
        .product-card {
            background: white; border-radius: 16px; overflow: hidden;
            box-shadow: var(--shadow-sm); transition: 0.3s; display: flex; flex-direction: column;
            border: 1px solid #e2e8f0; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); border-color: var(--primary); }
        
        .p-card-body { padding: 3rem; flex-grow: 1; display: flex; flex-direction: column; }
        
        .price-container { display: flex; align-items: baseline; justify-content: center; gap: 12px; margin: 1.5rem 0; flex-wrap: wrap; }
        .price-original { text-decoration: line-through; color: var(--price-strikethrough); font-size: 1.3rem; font-weight: 600; }
        .price-current { font-size: 2.5rem; font-weight: 800; color: var(--price-promo); line-height: 1; }
        
        .package-includes li { margin-bottom: 14px; display: flex; align-items: flex-start; gap: 12px; font-size: 1.05rem; }
        .package-includes i { color: var(--primary); margin-top: 4px; flex-shrink: 0; font-size: 1.2rem; }

        /* --- 8. MODAL FORM --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
        .modal-card {
            background: white; padding: 2.5rem; border-radius: 20px; width: 100%; max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); position: relative;
        }
        .modal-close { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .modal-close:hover { color: var(--text-main); transform: rotate(90deg); }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
        .form-input {
            width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-family: inherit; font-size: 1rem; background: #f8fafc; transition: 0.3s;
        }
        .form-input:focus { border-color: var(--primary); outline: none; background: white; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        /* --- 9. DETAIL VIEW & FOOTER --- */
        .detail-view { max-width: 900px; margin: 0 auto; background: white; padding: 3.5rem; border-radius: 24px; box-shadow: var(--shadow-md); }
        footer { background: white; padding: 4rem 0; margin-top: 5rem; border-top: 1px solid #e2e8f0; text-align: center; }

        /* --- 10. RESPONSIVE / MOBILE OPTIMIZATION --- */
        /* Tablet & Smaller Desktop */
        @media (max-width: 1024px) {
            .hero { grid-template-columns: 1fr; text-align: center; gap: 3.5rem; padding-top: 4rem; }
            .hero-text { margin: 0 auto; max-width: 800px; }
            .hero-text div[style*="display: flex"] { justify-content: center; } /* Center buttons */
            .key-message-box { justify-content: center; width: auto; display: inline-flex; }
            .hero-visual { max-width: 600px; margin: 0 auto; width: 100%; transform: none; }
            .visual-card { transform: none; }
            .stat-1 { right: 0; }
            .stat-2 { left: 0; }
            .benefits-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* Mobile Phones */
        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            
            /* Typography Scaling */
            .hero-text h1 { font-size: 2.2rem; line-height: 1.25; margin-bottom: 1rem; }
            .hero-text p { font-size: 1rem; }
            .section-title h2 { font-size: 2rem; }
            
            /* Navigation */
            .nav-links, .nav-content .cta-wa { display: none; }
            .mobile-menu-btn { display: block; }
            .navbar { padding: 1rem 0; }
            
            /* Hero & Spacing */
            .hero { padding: 2rem 0 4rem 0; gap: 2.5rem; }
            section.container { padding-bottom: 3rem; }
            
            /* Visuals */
            .visual-card img { height: 260px; }
            .floating-stat { padding: 0.8rem 1rem; font-size: 0.85rem; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
            .stat-1 { top: 15px; right: -10px; }
            .stat-2 { bottom: 25px; left: -10px; }
            
            /* Cards */
            .benefits-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .products-grid { grid-template-columns: 1fr; gap: 2rem; }
            .benefit-card, .product-card, .detail-view { padding: 1.5rem; }
            .p-card-body { padding: 1.5rem; }
            
            /* Thumb-friendly Touch Targets */
            .hero-text div[style*="display: flex"] { flex-direction: column; width: 100%; gap: 1rem; }
            .hero-text button, .detail-view button, .product-card button, .modal-card button { width: 100% !important; padding: 16px; font-size: 1.05rem; }
            
            .key-message-box { width: 100%; padding: 14px 20px; font-size: 0.95rem; border-radius: 12px; }
            
            /* Modal Fix */
            .modal-card { padding: 1.5rem; margin: 10px; max-height: 85vh; overflow-y: auto; }
            
            /* Tabs */
            .category-tabs { gap: 0.8rem; }
            .tab-btn { padding: 10px 20px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-blob blob-1" style="position:fixed; top:-10%; left:-10%; width:60vw; height:60vw; background:radial-gradient(circle, var(--primary), transparent); border-radius:50%; filter:blur(80px); opacity:0.5; z-index:-1; pointer-events:none;"></div>
    <div class="bg-blob blob-2" style="position:fixed; bottom:-10%; right:-10%; width:50vw; height:50vw; background:radial-gradient(circle, var(--accent), transparent); border-radius:50%; filter:blur(80px); opacity:0.5; z-index:-1; pointer-events:none;"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-content">
            <div onclick="navigate('home')" class="logo">
                <i class="ph-fill ph-polygon"></i> AM Agency
            </div>
            <!-- Desktop Menu -->
            <ul class="nav-links">
                <li class="nav-item active" onclick="navigate('home')">Utama</li>
                <li class="nav-item" onclick="navigate('products')">Pakej</li>
                <li class="nav-item" onclick="navigate('contact')">Hubungi</li>
            </ul>
            <button onclick="openModal('General Inquiry')" class="btn btn-accent cta-wa">
                <i class="ph-bold ph-whatsapp-logo"></i> WhatsApp Sekarang
            </button>
            <!-- Mobile Toggle -->
            <div class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="ph-bold ph-list"></i></div>
        </div>
        <!-- Mobile Menu -->
        <div class="mobile-nav-overlay" id="mobileMenu">
            <div onclick="navigate('home')">Utama</div>
            <div onclick="navigate('products')">Pakej</div>
            <div onclick="navigate('contact')">Hubungi</div>
            <button onclick="openModal('General Inquiry')" class="btn btn-accent" style="width:100%; margin-top:10px; padding: 14px;">WhatsApp Sekarang</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app"></main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="logo" style="justify-content: center; margin-bottom: 1rem;">AM Agency</div>
            <p style="margin-bottom: 1.5rem; color: var(--text-muted); max-width: 500px; margin-left: auto; margin-right: auto;">Membantu brand anda kekal relevan dan aktif di media sosial dengan content yang konsisten dan berkualiti.</p>
            <div style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem;">
                <a href="#" class="btn btn-secondary" style="border-radius: 50%; padding: 12px; width: 48px; height: 48px;"><i class="ph-bold ph-tiktok-logo" style="font-size: 1.2rem;"></i></a>
                <a href="#" class="btn btn-secondary" style="border-radius: 50%; padding: 12px; width: 48px; height: 48px;"><i class="ph-bold ph-facebook-logo" style="font-size: 1.2rem;"></i></a>
            </div>
            <p style="font-size: 0.9rem; color: #94a3b8;">&copy; 2024 AM Agency. All rights reserved.</p>
        </div>
    </footer>

    <!-- INQUIRY MODAL -->
    <div class="modal-overlay" id="inquiryModal">
        <div class="modal-card">
            <div class="modal-close" onclick="closeModal()"><i class="ph-bold ph-x"></i></div>
            <h3 style="margin-bottom: 1.5rem; text-align: center; color: var(--primary);">Isi Maklumat Anda</h3>
            <p style="text-align: center; margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.95rem;">Kami akan sediakan mesej automatik ke WhatsApp anda.</p>
            
            <input type="hidden" id="modalContext">
            <div class="form-group">
                <label class="form-label">Nama</label>
                <input type="text" id="modalName" class="form-input" placeholder="Nama Penuh">
            </div>
            <div class="form-group">
                <label class="form-label">Kawasan Tempat Tinggal</label>
                <input type="text" id="modalLocation" class="form-input" placeholder="Contoh: Shah Alam, Selangor">
            </div>
            <div class="form-group">
                <label class="form-label">Apa yang boleh dibantu?</label>
                <textarea id="modalMsg" class="form-input" rows="3" placeholder="Saya berminat..."></textarea>
            </div>
            
            <button onclick="submitModalInquiry()" class="btn btn-primary" style="width: 100%; border-radius: 8px;">
                Hantar ke WhatsApp <i class="ph-bold ph-whatsapp-logo"></i>
            </button>
        </div>
    </div>

    <!-- APP LOGIC -->
    <script>
        // --- DATA ---
        const products = [
            {
                id: 1,
                name: "Pakej Content Bulanan (SME)",
                category: "agency",
                originalPrice: "RM2800",
                price: "RM2200",
                pricePeriod: "/ Bulan",
                shortDescription: "Pakej lengkap untuk bisnes yang nak mula konsisten buat content tanpa kos besar.",
                fullDescription: "📌 Pakej ini sesuai untuk bisnes yang nak mula konsisten buat content tanpa kos besar. Kami uruskan semua dari A-Z supaya anda boleh fokus pada operasi bisnes.",
                includes: [
                    "±15 video TikTok (≤ 1 minit)", "Idea & script penuh", "Rakaman video (Kami ke premis 3-4x sebulan)",
                    "Editing + subtitle simple", "1–2 kali revision/video", "Posting TikTok ikut jadual",
                    "Facebook ambil video dari TikTok", "Video boleh digunakan untuk iklan (ads)"
                ],
                badge: "HARGA PROMO",
                image: ""
            },
            {
                id: 3, 
                name: "Talent: Amrie47",
                category: "talent",
                originalPrice: "",
                price: "", 
                pricePeriod: "",
                shortDescription: "Tech & Gaming Reviewer. Fresh perspective & engaging.",
                fullDescription: "Amrie47 adalah 'Go-to source' untuk review teknologi dan gaming. Bawa jenama anda kepada audiens yang tepat dengan gaya penyampaian yang natural dan informatif.",
                includes: [
                    "Gaming & Tech Reviewer Professional", "Aktif di TikTok & YouTube (Cross-platform)",
                    "Bonus: Video TikTok auto-upload ke YouTube", "Jangkauan audiens lebih luas (30K+ Monthly Views)",
                    "Sesuai untuk Product Review & Game Walkthrough", "Boleh terus ke channel talent untuk melihat portfolio dan hasil content"
                ],
                badge: "CREATOR PILIHAN",
                image: "https://image2url.com/r2/default/images/1769773169832-1ff149b3-64a0-4802-858d-8cad10f660da.jpg" 
            }
        ];

        const app = document.getElementById('app');
        const phoneNo = "601112576412";

        // --- FUNCTIONS ---
        function openWhatsApp(message) {
            window.open(`https://wa.me/${phoneNo}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // Modal Logic
        function openModal(context) {
            document.getElementById('inquiryModal').classList.add('active');
            document.getElementById('modalContext').value = context;
            document.getElementById('modalMsg').value = `Saya berminat dengan ${context}. Boleh terangkan lanjut?`;
        }
        function closeModal() { document.getElementById('inquiryModal').classList.remove('active'); }
        
        function submitModalInquiry() {
            const name = document.getElementById('modalName').value;
            const loc = document.getElementById('modalLocation').value;
            const msg = document.getElementById('modalMsg').value;
            const ctx = document.getElementById('modalContext').value;
            if(!name || !loc) return alert("Sila isi Nama dan Kawasan.");
            openWhatsApp(`Hi AM Agency,\n\nTopik: *${ctx}*\nNama: ${name}\nKawasan: ${loc}\n\nMesej: ${msg}`);
            closeModal();
        }
        window.onclick = e => { if(e.target == document.getElementById('inquiryModal')) closeModal(); }

        // Navigation
        function toggleMobileMenu() {
            const m = document.getElementById('mobileMenu');
            m.classList.toggle('open');
            document.querySelector('.mobile-menu-btn i').classList.toggle('ph-x');
            document.querySelector('.mobile-menu-btn i').classList.toggle('ph-list');
        }
        function navigate(page, param) {
            document.getElementById('mobileMenu').classList.remove('open');
            document.querySelector('.mobile-menu-btn i').classList.remove('ph-x');
            document.querySelector('.mobile-menu-btn i').classList.add('ph-list');
            
            window.scrollTo({top:0, behavior:'smooth'});
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            if(page === 'home') { 
                document.querySelectorAll('.nav-item')[0].classList.add('active'); renderHome(); 
            } else if (page === 'products') {
                document.querySelectorAll('.nav-item')[1].classList.add('active'); renderProducts(param || 'agency');
            } else if (page === 'detail') {
                renderDetail(param);
            } else if (page === 'contact') {
                document.querySelectorAll('.nav-item')[2].classList.add('active'); renderContact();
            }
        }

        // --- VIEWS ---
        function renderHome() {
            app.innerHTML = `
                <section class="container hero">
                    <div class="hero-text">
                        <div class="honest-note"><i class="ph-fill ph-rocket-launch"></i> AM Agency: Small Team, Big Impact</div>
                        <h1>Kami bantu bisnes kecil <span style="color:var(--primary)">nampak aktif</span> & yakinkan pelanggan melalui content video.</h1>
                        <p style="color: var(--text-muted);">AM Agency ialah small team yang fokus bantu local business & SME bina kehadiran di TikTok secara konsisten.</p>
                        <div class="key-message-box"><div class="key-message-icon"><i class="ph-bold ph-check"></i></div><span>Anda fokus urus bisnes. Kami urus content.</span></div>
                        <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                            <button onclick="openModal('General Inquiry')" class="btn btn-primary">📲 Hubungi di WhatsApp</button>
                            <button onclick="navigate('products')" class="btn btn-secondary">Lihat Pakej</button>
                        </div>
                    </div>
                    <div class="hero-visual">
                        <div class="visual-card">
                            <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=800&auto=format&fit=crop" alt="Camera">
                            <div style="position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.7); color:white; padding:6px 12px; border-radius:6px; display:flex; align-items:center; gap:8px; font-weight:700; backdrop-filter:blur(4px);">
                                <div style="width:10px; height:10px; background:#ef4444; border-radius:50%; animation: blink 1s infinite;"></div> REC
                            </div>
                        </div>
                        <div class="floating-stat stat-1"><i class="ph-fill ph-tiktok-logo"></i> <div><div style="font-size:0.8rem">Platform Fokus</div><strong>TikTok & FB</strong></div></div>
                        <div class="floating-stat stat-2"><i class="ph-fill ph-check-circle" style="color:var(--primary)"></i> <strong>TRUSTED</strong></div>
                    </div>
                </section>

                <section class="container" style="padding-bottom:6rem;">
                   <div style="background:rgba(255,255,255,0.9); border-radius:var(--radius-lg); padding:3rem; box-shadow:var(--shadow-md); backdrop-filter:blur(10px);">
                        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:4rem; align-items:center;">
                            <div>
                                <div class="badge badge-service" style="margin-bottom:1rem;">Tentang Kami</div>
                                <h2 style="font-size:2rem; margin-bottom:1.5rem; line-height:1.2;">Dari Pengalaman Sebenar, Untuk <span style="color:var(--primary)">Bisnes Sebenar</span>.</h2>
                                <p style="color:var(--text-muted); font-size:1.1rem;">AM Agency bermula daripada pengalaman mengurus content TikTok secara konsisten setiap hari untuk bisnes tempatan.</p>
                            </div>
                            <div style="background:#f8fafc; padding:2.5rem; border-radius:20px; border:1px solid #e2e8f0;">
                                <h3 style="margin-bottom:1.5rem; font-size:1.2rem;"><i class="ph-fill ph-warning-circle" style="color:#f59e0b"></i> Kami faham realiti SME:</h3>
                                <ul style="display:flex; flex-direction:column; gap:1.2rem;">
                                    <li style="display:flex; gap:12px; font-size:1.05rem;"><i class="ph-bold ph-x-circle" style="color:#ef4444; font-size:1.3rem;"></i> Tak cukup masa nak fikir content</li>
                                    <li style="display:flex; gap:12px; font-size:1.05rem;"><i class="ph-bold ph-x-circle" style="color:#ef4444; font-size:1.3rem;"></i> Nak posting tapi tak tahu nak cakap apa</li>
                                    <li style="display:flex; gap:12px; font-size:1.05rem;"><i class="ph-bold ph-x-circle" style="color:#ef4444; font-size:1.3rem;"></i> Nak nampak aktif, bukan sekadar ada akaun</li>
                                </ul>
                            </div>
                        </div>
                   </div>
                </section>

                <section class="container" style="padding-bottom:6rem;">
                    <div class="section-title"><h2>Apa Yang Kami Buat</h2><p>Kami urus content video TikTok dari A–Z:</p></div>
                    <div class="benefits-grid">
                        ${['Idea & Konsep', 'Script Penuh', 'Rakaman Video', 'Editing + Subtitle', 'Posting TikTok', 'Repurpose ke FB'].map((t,i) => `
                            <div class="benefit-card"><div class="icon-box"><i class="ph-bold ${['ph-lightbulb','ph-scroll','ph-video-camera','ph-scissors','ph-calendar-check','ph-facebook-logo'][i]}"></i></div><h3>${t}</h3></div>
                        `).join('')}
                    </div>
                </section>

                <section class="container" style="padding-bottom:6rem;">
                    <div style="background:linear-gradient(135deg, #f8fafc, #eef2ff); border-radius:var(--radius-lg); padding:3rem; border:1px solid #e2e8f0;">
                        <div class="section-title"><h2>Contoh Hasil Kerja</h2><p>Impak sebenar yang kami bawa.</p></div>
                        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:2rem; margin-bottom:3rem;">
                            ${createResultCard('ph-trend-up', '#dcfce7', '#166534', 'Views Konsisten', 'Video TikTok dengan prestasi stabil.')}
                            ${createResultCard('ph-chat-text', '#dbeafe', '#1e40af', 'Inquiry Sebenar', 'Komen & DM berbentuk pertanyaan.')}
                            ${createResultCard('ph-handshake', '#fae8ff', '#86198f', 'Trust Pelanggan', 'Content yang bantu yakinkan pelanggan.')}
                        </div>
                        <div style="text-align:center; padding:2rem; border:2px dashed var(--primary); border-radius:16px; background:white;">
                            <p style="font-size:1.1rem; color:var(--text-main);"><strong><i class="ph-fill ph-folder-open" style="margin-right:8px; color:var(--primary);"></i> Portfolio video & screenshot views disediakan atas permintaan.</strong></p>
                        </div>
                    </div>
                </section>
                
                <section class="container" style="padding-bottom:4rem;">
                    <div style="background:var(--gradient-main); border-radius:var(--radius-lg); padding:4rem 2rem; text-align:center; color:white; box-shadow:var(--shadow-md);">
                        <h2 style="font-size:2.5rem; margin-bottom:1rem;">Sedia Untuk Bermula?</h2>
                        <p style="font-size:1.2rem; opacity:0.9; margin-bottom:2rem; max-width:600px; margin-left:auto; margin-right:auto;">Jangan biarkan media sosial anda sunyi. Biar kami bantu naikkan brand anda.</p>
                        <button onclick="openModal('General Inquiry')" class="btn btn-secondary" style="color:var(--primary); font-weight:700;">Hubungi Kami Sekarang</button>
                    </div>
                </section>
            `;
        }

        function renderProducts(cat) {
            const filtered = products.filter(p => p.category === cat);
            app.innerHTML = `
                <section class="container" style="padding:6rem 20px;">
                    <div class="section-title"><h2>Pilihan Pakej</h2><p>Pilih kategori yang sesuai.</p></div>
                    <div class="category-tabs">
                        <button class="tab-btn ${cat==='agency'?'active':''}" onclick="renderProducts('agency')">Pakej Agency</button>
                        <button class="tab-btn ${cat==='talent'?'active':''}" onclick="renderProducts('talent')">Pakej Talent</button>
                    </div>
                    <div class="products-grid">
                        ${filtered.length ? filtered.map(createProductCard).join('') : '<p style="text-align:center; width:100%; grid-column:1/-1;">Tiada pakej dalam kategori ini.</p>'}
                    </div>
                </section>
            `;
        }

        function renderDetail(id) {
            const p = products.find(prod => prod.id == id);
            if(!p) return navigate('products');
            
            const priceSection = p.price ? `
                <div class="price-container" style="justify-content: flex-start; margin-top: 1.5rem;">
                    <span class="price-original">${p.originalPrice}</span>
                    <span class="price-current">${p.price}</span>
                    <span style="color:var(--text-muted); font-size:1rem; margin-left:5px;">${p.pricePeriod}</span>
                </div>` : '';

            const imgHTML = p.image ? `<img src="${p.image}" style="border-radius:16px; margin-bottom:2.5rem; box-shadow:var(--shadow-md); width:100%; max-height:500px; object-fit:cover;">` : '';

            app.innerHTML = `
                <section class="container" style="padding:6rem 20px;">
                    <button onclick="navigate('products','${p.category}')" class="btn" style="padding-left:0; margin-bottom:2rem; color:var(--text-muted); background:none; border:none; box-shadow:none;"><i class="ph-bold ph-arrow-left"></i> Kembali ke Pakej</button>
                    <div class="detail-view">
                        ${imgHTML}
                        <div style="border-bottom:1px solid #eee; padding-bottom:2rem; margin-bottom:2rem;">
                            <span class="badge badge-popular">${p.badge}</span>
                            <h1 style="margin-top:15px; line-height:1.2; font-size:2.5rem;">${p.name}</h1>
                            ${priceSection}
                        </div>
                        <p style="margin-bottom:2.5rem; font-size:1.15rem; color:var(--text-main); line-height:1.8;">${p.fullDescription}</p>
                        <div style="background:#f8fafc; padding:2rem; border-radius:16px; margin-bottom:2.5rem;">
                            <h3 style="margin-bottom:1.5rem; font-size:1.2rem;">Apa yang termasuk:</h3>
                            <ul class="package-includes">${p.includes.map(i=>`<li><i class="ph-fill ph-check-circle"></i> ${i}</li>`).join('')}</ul>
                        </div>
                        <div style="text-align:center;">
                            <button onclick="openModal('${p.name}')" class="btn btn-primary" style="width:100%; max-width:400px; font-size:1.1rem; padding:16px;">Tempah Sekarang <i class="ph-bold ph-whatsapp-logo"></i></button>
                            <p style="margin-top:15px; font-size:0.9rem; color:var(--text-muted);">Kami akan balas secepat mungkin.</p>
                        </div>
                    </div>
                </section>
            `;
        }

        function renderContact() {
            app.innerHTML = `
                <section class="container" style="padding:6rem 20px; max-width:700px;">
                    <div class="section-title"><h2>Hubungi Kami</h2><p>Ada soalan? Terus tanya kami.</p></div>
                    <div style="background:white; padding:3rem; border-radius:24px; box-shadow:var(--shadow-md);">
                        <div class="form-group"><label class="form-label">Nama</label><input id="cName" class="form-input" placeholder="Nama Anda"></div>
                        <div class="form-group"><label class="form-label">Kawasan</label><input id="cLoc" class="form-input" placeholder="Lokasi Anda"></div>
                        <div class="form-group"><label class="form-label">Mesej</label><textarea id="cMsg" class="form-input" rows="5" placeholder="Pertanyaan..."></textarea></div>
                        <button onclick="submitContact()" class="btn btn-primary" style="width:100%; margin-top:1rem;">Hantar WhatsApp</button>
                    </div>
                </section>
            `;
        }

        // --- HELPERS ---
        function createProductCard(p) {
            const priceDiv = p.price ? `
                <div class="price-container">
                    <span class="price-original">${p.originalPrice}</span>
                    <span class="price-current">${p.price}</span>
                </div>` : '<div style="margin-bottom:1.5rem;"></div>';
                
            const imgDiv = p.image ? `<div style="height:240px; overflow:hidden; border-bottom:1px solid #eee;"><img src="${p.image}" style="height:100%; width:100%; object-fit:cover;" onerror="this.style.display='none'; this.parentElement.style.backgroundColor='#f1f5f9';"></div>` : '';

            return `
                <div class="product-card">
                    ${imgDiv}
                    <div class="p-card-body">
                        <div style="text-align:center; margin-bottom:1.5rem;">
                            <div class="badge badge-popular">${p.badge}</div>
                            <h3 style="font-size:1.5rem; margin:12px 0;">${p.name}</h3>
                            ${priceDiv}
                        </div>
                        <ul class="package-includes" style="margin-bottom:2.5rem;">
                            ${p.includes.slice(0,4).map(i=>`<li><i class="ph-fill ph-check"></i> ${i}</li>`).join('')}
                            ${p.includes.length > 4 ? `<li style="color:var(--primary); font-weight:600; margin-top:10px;">+ ${p.includes.length - 4} lagi...</li>` : ''}
                        </ul>
                        <button onclick="navigate('detail', ${p.id})" class="btn btn-primary" style="width:100%; margin-top:auto;">Lihat Detail</button>
                    </div>
                </div>
            `;
        }

        function createResultCard(icon, bg, color, title, desc) {
            return `<div style="background:white; padding:2.5rem; border-radius:16px; text-align:center; box-shadow:var(--shadow-sm); border:1px solid #f1f5f9;">
                <div style="width:60px; height:60px; background:${bg}; color:${color}; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 1.5rem auto; font-size:1.8rem;"><i class="ph-fill ${icon}"></i></div>
                <h3 style="font-size:1.3rem; margin-bottom:0.8rem;">${title}</h3><p style="color:var(--text-muted); font-size:1rem;">${desc}</p>
            </div>`;
        }

        function submitContact() {
            const n=document.getElementById('cName').value, l=document.getElementById('cLoc').value, m=document.getElementById('cMsg').value;
            if(!n || !l) return alert("Sila isi nama dan kawasan.");
            openWhatsApp(`Hi AM Agency,\nNama: ${n}\nKawasan: ${l}\nMesej: ${m}`);
        }

        // Init
        renderHome();
    </script>
</body>
</html>
</html>
